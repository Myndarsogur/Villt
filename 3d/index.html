<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <title>3D heimur</title>
  <style>
    :root {
      --ui-bg: rgba(0, 0, 0, 0.55);
      --ui-text: #f7f7f7;
    }
    body { margin: 0; overflow: hidden; background: #87cefa; }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      background: var(--ui-bg);
      color: var(--ui-text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      border-radius: 6px;
      max-width: 280px;
      z-index: 10;
      line-height: 1.4;
      pointer-events: none;
    }
    #prompt {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: var(--ui-bg);
      color: #ffeb3b;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      border-radius: 8px;
      z-index: 10;
      min-width: 180px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #prompt.visible { opacity: 1; }
    #fractal-hint {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px 14px;
      background: var(--ui-bg);
      color: #9cf1ff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      border-radius: 6px;
      max-width: 240px;
      z-index: 10;
      line-height: 1.4;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <audio id="fractal-audio" loop preload="auto" style="display:none">
    <source src="lagid.mp3" type="audio/mpeg">
  </audio>
  <div id="hud" style="display:none"></div>
  <div id="prompt" style="display:none"></div>
  <div id="fractal-hint">Fraktal virkni: notaðu hreyfingar til að hræra í mynstrinu</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.159.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87cefa); // himinn

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 10);

    // Lyklaborðs inntak
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);
    // Snertistýring til að labba á síma
    let touchStartPos = null;
    let touchDir = { x: 0, y: 0 };
    let touchTapPos = null;
    const resetTouch = () => { touchDir = { x: 0, y: 0 }; };
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        touchStartPos = { x: t.clientX, y: t.clientY };
        touchTapPos = { x: t.clientX, y: t.clientY };
        touchDir = { x: 0, y: 0 };
      }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!touchStartPos || e.touches.length === 0) return;
      const t = e.touches[0];
      const dx = t.clientX - touchStartPos.x;
      const dy = t.clientY - touchStartPos.y;
      const mag = Math.max(1, Math.hypot(dx, dy));
      touchDir = { x: dx / mag, y: dy / mag };
    }, { passive: true });
    window.addEventListener('touchend', () => {
      touchStartPos = null;
      resetTouch();
    });

    // Hljóð (þú getur bætt wind.mp3, birds.mp3, footsteps.mp3, bleat.mp3 í sömu möppu)
    let audioInitiated = false;
    let ambientWind = null;
    let ambientBirds = null;
    let footstepAudio = null;
    let bleatAudio = null;
    let bleatTimer = 0;
    let footstepActive = false;

    function createAudio(src, loop = false, volume = 1) {
      const a = new Audio(src);
      a.loop = loop;
      a.preload = 'auto';
      a.volume = volume;
      return a;
    }

    function ensureAudio() {
      if (audioInitiated) return;
      audioInitiated = true;
      try {
        ambientWind = createAudio('wind.mp3', true, 0.25);
        ambientWind.play().catch(() => {});
      } catch (e) {}
      try {
        ambientBirds = createAudio('birds.mp3', true, 0.2);
        ambientBirds.play().catch(() => {});
      } catch (e) {}
      try {
        footstepAudio = createAudio('footsteps.mp3', true, 0.35);
      } catch (e) {}
      try {
        bleatAudio = createAudio('bleat.mp3', false, 0.4);
      } catch (e) {}
    }

    function setFootsteps(active) {
      if (!footstepAudio) return;
      if (active && !footstepActive) {
        footstepActive = true;
        footstepAudio.currentTime = 0;
        footstepAudio.play().catch(() => {});
      } else if (!active && footstepActive) {
        footstepActive = false;
        footstepAudio.pause();
      }
    }

    // Ljós
    const hemi = new THREE.HemisphereLight(0xffffff, 0x888844, 0.9);
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 10, 7);
    scene.add(hemi, dir);

    // Jörð með smá áferð
    function makeGroundTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      const base = ctx.createLinearGradient(0, 0, 0, 512);
      base.addColorStop(0, '#4fbf73');
      base.addColorStop(1, '#3b9257');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let i = 0; i < 2000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.random() * 1.8;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    const groundTex = makeGroundTexture();
    groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(18, 18);
    const groundGeo = new THREE.PlaneGeometry(400, 400);
    const groundMat = new THREE.MeshLambertMaterial({ map: groundTex });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const rand = (min, max) => min + Math.random() * (max - min);

    // Tré sem billboard (tvær hliðar) með smá fjölbreytileika
    function makeTreeTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const trunkW = rand(12, 20);
      const trunkH = rand(40, 60);
      const trunkX = 64 - trunkW / 2;
      const trunkY = 128 - trunkH - 8;
      ctx.fillStyle = ['#8B5A2B', '#6f4a1e', '#9c6b2f'][seed % 3];
      ctx.fillRect(trunkX, trunkY, trunkW, trunkH); // stöng

      const layers = 2 + (seed % 2);
      ctx.beginPath();
      for (let i = 0; i < layers; i++) {
        const topY = 28 + i * 18;
        const baseY = 78 + i * 10;
        const spread = 32 + i * 10 + rand(-4, 4);
        ctx.beginPath();
        ctx.moveTo(64, topY);
        ctx.lineTo(64 + spread, baseY);
        ctx.lineTo(64 - spread, baseY);
        ctx.closePath();
        ctx.fillStyle = ['#2ECC71', '#2fb06f', '#35d17c'][seed % 3];
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }
    function makeSoftTreeTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const trunkW = rand(10, 14);
      const trunkH = rand(26, 38);
      const trunkX = 64 - trunkW / 2;
      const trunkY = 128 - trunkH - 10;
      ctx.fillStyle = ['#7a4a24', '#6c3c1a', '#8c5c2d'][seed % 3];
      ctx.fillRect(trunkX, trunkY, trunkW, trunkH);

      const centerX = 64;
      const centerY = 56;
      const r = 35 + rand(-4, 6);
      const grad = ctx.createRadialGradient(centerX, centerY, r * 0.2, centerX, centerY, r);
      const greens = [
        ['#3ac483', '#259b63'],
        ['#3fbf78', '#2c8f5d'],
        ['#43d08f', '#2b9c6a'],
      ];
      const palette = greens[seed % greens.length];
      grad.addColorStop(0, palette[0]);
      grad.addColorStop(1, palette[1]);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, r * 1.05, r * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    function makeBushTexture(seed = 0, berryColor = 'blue') {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 48);
      const greens = [
        ['#2f7f46', '#1f5c31'],
        ['#2e8b50', '#205e35'],
        ['#288a52', '#1c5935'],
      ];
      const palette = greens[seed % greens.length];
      grad.addColorStop(0, palette[0]);
      grad.addColorStop(1, palette[1]);
      ctx.fillStyle = grad;

      // tvöföld "mm" sveigja
      ctx.beginPath();
      ctx.ellipse(48, 76, 32, 30, 0, 0, Math.PI * 2);
      ctx.ellipse(80, 76, 32, 30, 0, 0, Math.PI * 2);
      ctx.fill();

      // extra bumps
      const bumps = 8;
      for (let i = 0; i < bumps; i++) {
        const x = 40 + i * 10 + rand(-6, 6);
        const y = 66 + rand(-6, 6);
        const rx = 16 + rand(-2, 4);
        const ry = 12 + rand(-2, 3);
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // berries
      const berryCount = 5 + Math.floor(Math.random() * 6);
      for (let i = 0; i < berryCount; i++) {
        const x = 36 + Math.random() * 56;
        const y = 52 + Math.random() * 26;
        const isBlue = berryColor === 'blue';
        ctx.fillStyle = isBlue ? '#4c7cff' : '#ff4d4d';
        ctx.beginPath();
        ctx.arc(x, y, 2.6 + Math.random() * 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(x - 1, y - 1.5, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function makeMushroomTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f5e1c8';
      ctx.fillRect(58, 72, 12, 32); // stilkur
      ctx.beginPath();
      ctx.arc(64, 70, 20, Math.PI, 0);
      ctx.closePath();
      const caps = ['#d93f3f', '#e3592f', '#c63448'];
      ctx.fillStyle = caps[seed % caps.length];
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let i = 0; i < 6; i++) {
        const x = 52 + i * 6 + rand(-2, 2);
        const y = 52 + rand(0, 12);
        const r = rand(2, 4);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function makeSheepTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f2f2f2';
      ctx.beginPath();
      ctx.ellipse(64, 70, 34, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#d9d9d9';
      ctx.beginPath();
      ctx.ellipse(64, 52, 26, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ['#5a4633', '#3c2f23'][seed % 2];
      ctx.beginPath();
      ctx.ellipse(82, 60, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(86, 58, 2.2, 0, Math.PI * 2);
      ctx.fill();
      // augu
      ctx.beginPath();
      ctx.arc(82, 57, 1.5, 0, Math.PI * 2);
      ctx.arc(88, 59, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#d9d9d9';
      for (let i = 0; i < 4; i++) {
        const x = 52 + i * 10;
        ctx.fillRect(x, 90, 6, 18);
      }
      return new THREE.CanvasTexture(c);
    }

    function makeBirdTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.strokeStyle = ['#111', '#222', '#333'][seed % 3];
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(36, 64);
      ctx.quadraticCurveTo(64, 36, 92, 64);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(36, 64);
      ctx.quadraticCurveTo(64, 52, 92, 64);
      ctx.stroke();
      return new THREE.CanvasTexture(c);
    }

    const treeTextures = [makeTreeTexture(0), makeTreeTexture(1), makeTreeTexture(2)];
    const softTreeTextures = [makeSoftTreeTexture(0), makeSoftTreeTexture(1), makeSoftTreeTexture(2)];
    const bushTexturesBlue = [makeBushTexture(0, 'blue'), makeBushTexture(1, 'blue'), makeBushTexture(2, 'blue')];
    const bushTexturesRed = [makeBushTexture(0, 'red'), makeBushTexture(1, 'red'), makeBushTexture(2, 'red')];
    const mushroomTextures = [makeMushroomTexture(0), makeMushroomTexture(1), makeMushroomTexture(2)];
    const sheepTextures = [makeSheepTexture(0), makeSheepTexture(1)];
    const birdTextures = [makeBirdTexture(0), makeBirdTexture(1), makeBirdTexture(2)];

    function makeFlowerTexture(seed = 0) {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const petals = [['#ff6fa0', '#ff99c2'], ['#ffd84d', '#ffe784'], ['#8ad4ff', '#b7e8ff']];
      const p = petals[seed % petals.length];
      for (let i = 0; i < 6; i++) {
        const ang = (Math.PI * 2 * i) / 6;
        const x = 32 + Math.cos(ang) * 10;
        const y = 32 + Math.sin(ang) * 10;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, 12);
        grad.addColorStop(0, p[0]);
        grad.addColorStop(1, p[1]);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(x, y, 8, 6, ang, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#ffd35c';
      ctx.beginPath();
      ctx.arc(32, 32, 6, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }
    const flowerTextures = [makeFlowerTexture(0), makeFlowerTexture(1), makeFlowerTexture(2)];

    const trees = new THREE.Group();
    const treeCount = 240;
    for (let i = 0; i < treeCount; i++) {
      const texSet = i % 4 === 0 ? softTreeTextures : treeTextures;
      const tex = texSet[i % texSet.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const scaleY = 4 + Math.random() * 4.5;
      const scaleX = scaleY * (0.5 + Math.random() * 0.3);
      sprite.scale.set(scaleX, scaleY, 1);
      const radius = 10 + Math.random() * 240;
      const angle = Math.random() * Math.PI * 2;
      sprite.position.set(Math.cos(angle) * radius, scaleY * 0.5 + 0.4, Math.sin(angle) * radius);
      trees.add(sprite);
    }
    scene.add(trees);

    // Fjöll í fjarska
    const mountains = new THREE.Group();
    const mountainCount = 8;
    for (let i = 0; i < mountainCount; i++) {
      const height = 20 + Math.random() * 18;
      const radius = 40 + Math.random() * 25;
      const color = new THREE.Color().setHSL(0.12 + Math.random() * 0.05, 0.4, 0.35 + Math.random() * 0.1);
      const geom = new THREE.ConeGeometry(radius, height, 4 + Math.floor(Math.random() * 4));
      const mat = new THREE.MeshStandardMaterial({ color, flatShading: true });
      const cone = new THREE.Mesh(geom, mat);
      const dist = 220 + Math.random() * 120;
      const ang = Math.random() * Math.PI * 2;
      cone.position.set(Math.cos(ang) * dist, height * 0.5, Math.sin(ang) * dist);
      cone.rotation.y = Math.random() * Math.PI;
      mountains.add(cone);
    }
    scene.add(mountains);

    const bushes = new THREE.Group();
    const bushCount = 180;
    for (let i = 0; i < bushCount; i++) {
      const useBlue = Math.random() < 0.5;
      const texSet = useBlue ? bushTexturesBlue : bushTexturesRed;
      const tex = texSet[i % texSet.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const scale = 1.4 + Math.random() * 1.6;
      sprite.scale.set(scale * (1.4 + Math.random() * 0.4), scale, 1);
      const radius = 8 + Math.random() * 220;
      const angle = Math.random() * Math.PI * 2;
      sprite.position.set(Math.cos(angle) * radius, scale * 0.35 + 0.2, Math.sin(angle) * radius);
      sprite.userData.wavePhase = Math.random() * Math.PI * 2;
      sprite.userData.waveSpeed = 0.8 + Math.random() * 0.6;
      sprite.userData.baseScale = { x: sprite.scale.x, y: sprite.scale.y };
      bushes.add(sprite);
    }
    scene.add(bushes);

    const mushrooms = new THREE.Group();
    const mushroomCount = 260;
    for (let i = 0; i < mushroomCount; i++) {
      const tex = mushroomTextures[i % mushroomTextures.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const scale = 0.6 + Math.random() * 0.7;
      sprite.scale.set(scale, scale, 1);
      const radius = 6 + Math.random() * 200;
      const angle = Math.random() * Math.PI * 2;
      sprite.position.set(Math.cos(angle) * radius, scale * 0.5, Math.sin(angle) * radius);
      mushrooms.add(sprite);
    }
    scene.add(mushrooms);

    const flowers = new THREE.Group();
    const flowerCount = 320;
    for (let i = 0; i < flowerCount; i++) {
      const tex = flowerTextures[i % flowerTextures.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const scale = 0.5 + Math.random() * 0.5;
      sprite.scale.set(scale * 1.1, scale * 1.1, 1);
      const radius = 4 + Math.random() * 200;
      const angle = Math.random() * Math.PI * 2;
      sprite.position.set(Math.cos(angle) * radius, scale * 0.5, Math.sin(angle) * radius);
      flowers.add(sprite);
    }
    scene.add(flowers);

    // Kindur
    const sheep = new THREE.Group();
    const sheepCount = 18;
    for (let i = 0; i < sheepCount; i++) {
      const tex = sheepTextures[i % sheepTextures.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const scale = 1.2 + Math.random() * 0.6;
      sprite.scale.set(scale * 2.5, scale * 2, 1);
      const radius = 6 + Math.random() * 140;
      const angle = Math.random() * Math.PI * 2;
      sprite.position.set(Math.cos(angle) * radius, scale * 0.5 + 0.3, Math.sin(angle) * radius);
      sprite.userData.dir = Math.random() * Math.PI * 2;
      sprite.userData.speed = 0.5 + Math.random() * 0.6;
      sprite.userData.grazeTime = Math.random() * 4;
      sprite.userData.state = 'walk'; // walk/graze
      sheep.add(sprite);
    }
    scene.add(sheep);

    // Fuglarnir
    const birds = new THREE.Group();
    const birdCount = 14;
    for (let i = 0; i < birdCount; i++) {
      const tex = birdTextures[i % birdTextures.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const scale = 1.3 + Math.random() * 0.6;
      sprite.scale.set(scale * 2.4, scale * 1.5, 1);
      const radius = 60 + Math.random() * 160;
      const angle = Math.random() * Math.PI * 2;
      sprite.position.set(Math.cos(angle) * radius, 8 + Math.random() * 6, Math.sin(angle) * radius);
      sprite.userData.orbitR = radius;
      sprite.userData.orbitA = angle;
      sprite.userData.alt = sprite.position.y;
      sprite.userData.flap = Math.random() * Math.PI * 2;
      sprite.userData.speed = 0.25 + Math.random() * 0.35;
      birds.add(sprite);
    }
    scene.add(birds);

    // Ský
    function makeCloudTexture(seedOffset = 0) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(255,255,255,0.0)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      const circles = 7;
      for (let i = 0; i < circles; i++) {
        const x = 30 + i * 32 + Math.random() * 18 + seedOffset * 3;
        const y = 50 + Math.random() * 22 + seedOffset;
        const r = 24 + Math.random() * 22;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    const cloudTextures = [makeCloudTexture(0), makeCloudTexture(10), makeCloudTexture(-10)];
    const clouds = new THREE.Group();
    const cloudCount = 28;
    for (let i = 0; i < cloudCount; i++) {
      const tex = cloudTextures[i % cloudTextures.length];
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(18 + Math.random() * 20, 9 + Math.random() * 8, 1);
      sprite.position.set(-220 + Math.random() * 440, 20 + Math.random() * 14, -220 + Math.random() * 440);
      sprite.userData.speed = 0.18 + Math.random() * 0.35;
      sprite.userData.bound = 240;
      clouds.add(sprite);
    }
    scene.add(clouds);

    // Rauði kassinn
    const targetCube = new THREE.Mesh(
      new THREE.BoxGeometry(3, 3, 3),
      new THREE.MeshStandardMaterial({ color: 0xff0033, emissive: 0x330000 })
    );
    targetCube.position.set(0, 1.5, -80);
    scene.add(targetCube);

    // Fraktal ástand
    let inFractal = false;
    let fractalGroup = null;
    let fractalGroup2 = null;
    const fractalAudio = document.getElementById('fractal-audio');
    const promptEl = document.getElementById('prompt');
    const fractalHint = document.getElementById('fractal-hint');
    let fractalDepth = 0;
    let fractalData2 = null;

    function showPrompt(show) {
      promptEl.classList.toggle('visible', show);
    }

    function createFractalGroup(scale = 1, count = 2000, size = 0.25) {
      const group = new THREE.Group();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < count; i++) {
        const angle = i * golden;
        const radius = scale * 0.08 * Math.sqrt(i);
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = (i - count / 2) * 0.0035 * scale;
        positions[i * 3 + 2] = Math.sin(angle) * radius;

        const t = i / count;
        colors[i * 3] = 0.5 + 0.5 * Math.sin(t * 10);
        colors[i * 3 + 1] = 0.5 + 0.5 * Math.sin(t * 13 + 1.2);
        colors[i * 3 + 2] = 0.5 + 0.5 * Math.sin(t * 17 + 2.4);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false });
      const points = new THREE.Points(geo, mat);
      group.add(points);
      return { group, points };
    }

    let fractalData = null;
    function enterFractal() {
      if (inFractal) return;
      inFractal = true;
      window.location.href = 'fractal.html'; // hoppa í nýtt psychedelic umhverfi
    }

    // Hreyfing
    let yaw = 0;
    const moveSpeed = 12;
    const rotSpeed = 1.6;
    let lastTime = performance.now();
    let pendingFractal = false;
    let pendingTimer = 0;

    function updateMovement(dt) {
      const forward = (keys['ArrowUp'] || keys['KeyW']) || (touchDir.y < -0.2);
      const backward = (keys['ArrowDown'] || keys['KeyS']) || (touchDir.y > 0.2);
      const left = (keys['ArrowLeft'] || keys['KeyA']) || (touchDir.x < -0.2);
      const right = (keys['ArrowRight'] || keys['KeyD']) || (touchDir.x > 0.2);

      const moving = forward || backward || left || right;
      if (moving) ensureAudio();
      setFootsteps(moving);

      if (left && !right) yaw += rotSpeed * dt;
      if (right && !left) yaw -= rotSpeed * dt;

      const dir = new THREE.Vector3();
      if (forward) dir.z -= 1;
      if (backward) dir.z += 1;
      dir.normalize();

      const sin = Math.sin(yaw);
      const cos = Math.cos(yaw);
      const dx = dir.z * sin;
      const dz = dir.z * cos;

      camera.position.x += dx * moveSpeed * dt;
      camera.position.z += dz * moveSpeed * dt;

      camera.rotation.y = yaw;
      camera.position.y = 1.6;
    }

    function updateClouds(dt) {
      clouds.children.forEach(c => {
        c.position.x += c.userData.speed * dt * 8;
        if (c.position.x > c.userData.bound) c.position.x = -c.userData.bound;
      });
    }

    function updateBushes(dt) {
      bushes.children.forEach(b => {
        b.userData.wavePhase += dt * b.userData.waveSpeed;
        const wobble = Math.sin(b.userData.wavePhase) * 0.06;
        b.scale.x = b.userData.baseScale.x * (1 + wobble);
        b.scale.y = b.userData.baseScale.y * (1 + wobble * 0.7);
      });
    }

    function updateSheep(dt) {
      sheep.children.forEach(s => {
        s.userData.grazeTime -= dt;
        if (s.userData.grazeTime <= 0) {
          if (s.userData.state === 'walk') {
            s.userData.state = 'graze';
            s.userData.grazeTime = 2 + Math.random() * 3;
          } else {
            s.userData.state = 'walk';
            s.userData.grazeTime = 4 + Math.random() * 5;
            s.userData.dir += rand(-0.6, 0.6);
          }
        }
        if (s.userData.state === 'walk') {
          s.userData.dir += rand(-0.08, 0.08) * dt;
          const dx = Math.sin(s.userData.dir) * s.userData.speed * dt * 2.4;
          const dz = Math.cos(s.userData.dir) * s.userData.speed * dt * 2.4;
          s.position.x += dx;
          s.position.z += dz;
          const r = Math.hypot(s.position.x, s.position.z);
          const maxR = 180;
          if (r > maxR) {
            s.userData.dir += Math.PI + rand(-0.4, 0.4);
          }
        }
        s.material.rotation = 0;
      });
    }

    function updateBirds(dt) {
      birds.children.forEach(b => {
        b.userData.orbitA += dt * b.userData.speed;
        b.userData.flap += dt * 6;
        const yOsc = Math.sin(b.userData.flap) * 0.4;
        const r = b.userData.orbitR;
        b.position.set(Math.cos(b.userData.orbitA) * r, b.userData.alt + yOsc, Math.sin(b.userData.orbitA) * r);
        b.material.rotation = -b.userData.orbitA + Math.PI / 2;
      });
    }

    function updateFractal(dt) {
      if (!fractalGroup || !fractalData) return;
      fractalDepth += dt * 12;

      const time = performance.now() * 0.001;
      const wobble = Math.sin(time * 0.7) * 0.25;

      fractalGroup.position.z = -fractalDepth * 1.2;
      fractalGroup2.position.z = -fractalDepth * 0.8 - 8;

      fractalGroup.rotation.y += dt * 0.6;
      fractalGroup.rotation.x += dt * 0.14;
      fractalGroup2.rotation.y -= dt * 0.4;
      fractalGroup2.rotation.x += dt * 0.08;

      const posAttr = fractalData.points.geometry.getAttribute('position');
      const posAttr2 = fractalData2.points.geometry.getAttribute('position');
      for (let i = 0; i < posAttr.count; i++) {
        const y = posAttr.getY(i);
        posAttr.setY(i, y + Math.sin(time + i * 0.02) * 0.0008);
      }
      for (let i = 0; i < posAttr2.count; i++) {
        const y = posAttr2.getY(i);
        posAttr2.setY(i, y + Math.cos(time * 1.2 + i * 0.018) * 0.0011);
      }
      posAttr.needsUpdate = true;
      posAttr2.needsUpdate = true;

      // fallandi tilfinning
      camera.position.y = 1.1 + wobble * 0.4;
      camera.position.z -= dt * 10;

      // litaflæði
      const hue = (time * 0.07) % 1;
      scene.background = new THREE.Color().setHSL(hue, 0.6, 0.08 + 0.1 * Math.sin(time * 0.6) * 0.5);
    }

    function checkTarget() {
      if (inFractal) return;
      const dist = camera.position.distanceTo(targetCube.position);
      const near = dist < 3.2;
      if (near) {
        if (!pendingFractal) {
          pendingFractal = true;
          pendingTimer = 0;
        }
      } else {
        pendingFractal = false;
        pendingTimer = 0;
      }
    }

    function animate() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // Slembijarm af og til
      if (bleatAudio && audioInitiated) {
        bleatTimer -= dt;
        if (bleatTimer <= 0) {
          if (Math.random() < 0.2) {
            bleatAudio.currentTime = 0;
            bleatAudio.play().catch(() => {});
          }
          bleatTimer = 8 + Math.random() * 16;
        }
      }

      if (!inFractal) {
        updateMovement(dt);
        updateClouds(dt);
        updateBushes(dt);
        updateSheep(dt);
        updateBirds(dt);
        checkTarget();
        if (pendingFractal) {
          pendingTimer += dt;
          yaw += dt * 1.8; // smá snúningur
          camera.rotation.y = yaw;
          camera.rotation.x = Math.sin(pendingTimer * 1.5) * 0.15; // vertical sway
          if (pendingTimer >= 3) {
            enterFractal();
          }
        }
      } else {
        updateMovement(dt * 0.5); // hægari í fraktal
        updateFractal(dt);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
